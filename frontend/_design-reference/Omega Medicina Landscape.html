<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Omega Medicina — Landscape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body { padding: 40px 20px; background:
    radial-gradient(1400px 900px at 10% 0%, rgba(226,62,74,0.06), transparent 60%),
    radial-gradient(1000px 800px at 100% 100%, rgba(79,184,168,0.04), transparent 60%),
    var(--bg-0);
  }
  .top-bar { max-width: 1700px; margin: 0 auto 28px; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .top-bar .brand { display: flex; align-items: center; gap: 12px; }
  .top-bar .brand img { width: 32px; height: 26px; object-fit: contain; }
  .top-bar h1 { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
  .top-bar h1 em { font-family: var(--font-serif); color: var(--omega); font-size: 24px; }
  .top-bar .sub { font-size: 12px; color: var(--text-2); margin-top: 2px; }

  .mode-switch { display: flex; gap: 2px; background: var(--bg-1); padding: 4px; border-radius: 10px; border: 1px solid var(--line); }
  .mode-switch a { padding: 7px 14px; font-size: 12px; color: var(--text-2); text-decoration: none; border-radius: 7px; font-family: var(--font-sans); font-weight: 500; }
  .mode-switch a.active { background: var(--omega-soft); color: var(--omega); }
  .mode-switch a:hover:not(.active) { color: var(--text-1); }

  .landscape-grid {
    max-width: 1700px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(760px, 1fr)); gap: 40px;
  }

  /* Horizontal phone frame (landscape) */
  .phone-landscape {
    width: 760px; height: 374px; /* 2:1 aspect for readability; actual iPhone is ~2.16:1 */
    border-radius: 54px; overflow: hidden; position: relative; background: #0B0A0C;
    box-shadow: 0 40px 100px rgba(0,0,0,0.7), 0 0 0 12px #1a181b, 0 0 0 13px #0b0a0c;
    margin: 0 auto;
  }
  /* Dynamic island on the left when landscape (rotated device) */
  .phone-landscape .island {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    width: 34px; height: 120px; border-radius: 24px; background: #000; z-index: 100;
  }
  .phone-landscape .statusbar {
    position: absolute; left: 0; top: 0; bottom: 0; width: 50px;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 28px 0; z-index: 50; font-family: var(--font-sans); font-size: 13px; font-weight: 600; color: #F4F1F3;
  }
  .phone-landscape .statusbar .time { writing-mode: vertical-rl; transform: rotate(180deg); }
  .phone-landscape .home-indicator {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 5px; height: 134px; background: rgba(255,255,255,0.5); border-radius: 100px; z-index: 100;
  }
  .phone-landscape .screen-land {
    position: absolute; left: 50px; top: 0; right: 20px; bottom: 0;
    background: var(--bg-0); overflow: hidden;
    display: flex;
  }

  .screen-caption { text-align: center; margin-top: 16px; }
  .screen-caption .l { font-size: 13px; font-weight: 600; color: var(--text-1); }
  .screen-caption .s { font-size: 11px; color: var(--text-3); margin-top: 2px; }

  /* Landscape two-pane layout: left rail + content */
  .land-rail {
    width: 190px; background: rgba(19,18,21,0.8); border-right: 1px solid var(--line);
    padding: 14px 10px; display: flex; flex-direction: column; gap: 2px;
    overflow-y: auto; flex-shrink: 0;
  }
  .land-rail .logo { display: flex; align-items: center; gap: 8px; padding: 4px 8px 14px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .land-rail .logo img { width: 20px; height: 16px; }
  .land-rail .logo span { font-size: 11px; font-weight: 600; }
  .land-rail .logo em { font-family: var(--font-serif); color: var(--omega); font-size: 13px; }
  .land-rail button {
    display: flex; align-items: center; gap: 10px; padding: 7px 10px;
    background: transparent; border: 0; color: var(--text-2); font-size: 11px;
    border-radius: 6px; cursor: pointer; text-align: left; font-family: var(--font-sans);
  }
  .land-rail button.active { background: var(--omega-soft); color: var(--omega); }
  .land-content {
    flex: 1; overflow-y: auto; padding: 16px 18px;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent;
  }

  section.group {
    max-width: 1700px; margin: 0 auto 36px;
  }
  section.group > h2 {
    font-size: 18px; font-weight: 500; letter-spacing: -0.02em; margin-bottom: 18px;
    display: flex; align-items: center; gap: 10px;
  }
  section.group > h2::before {
    content: ''; display: inline-block; width: 3px; height: 18px; background: var(--omega); border-radius: 2px;
  }
  section.group > h2 em { font-family: var(--font-serif); font-style: italic; }
</style>
</head>

// Landscape phone with left rail (module nav) + content pane
function LandscapePhone({ label, sub, rail, initial, screens, accent = '#E23E4A' }) {
  const [active, setActive] = useState(initial);
  const Screen = screens[active] || screens[initial];
  return (
    <div>
      <div className="phone-landscape">
        <div className="island"/>
        <div className="statusbar">
          <span className="time">9:41</span>
          <svg width="18" height="10" viewBox="0 0 18 10" style={{ transform: 'rotate(90deg)' }}>
            <rect x="0" y="6" width="3" height="4" rx="0.5" fill="#F4F1F3"/>
            <rect x="5" y="4" width="3" height="6" rx="0.5" fill="#F4F1F3"/>
            <rect x="10" y="2" width="3" height="8" rx="0.5" fill="#F4F1F3"/>
            <rect x="15" y="0" width="3" height="10" rx="0.5" fill="#F4F1F3"/>
          </svg>
        </div>
        <div className="screen-land">
          <div className="land-rail">
            <div className="logo">
              <img src="assets/logo-white.png" alt=""/>
              <span><em>Omega</em></span>
            </div>
            {rail.map(r => (
              <button key={r.id} className={active === r.id ? 'active' : ''} onClick={() => setActive(r.id)}
                style={active === r.id ? { background: (r.color || accent) + '22', color: r.color || accent } : {}}>
                <Icon name={r.icon} size={13} color="currentColor"/>
                <span>{r.label}</span>
              </button>
            ))}
          </div>
          <div className="land-content">
            {Screen}
          </div>
        </div>
        <div className="home-indicator"/>
      </div>
      <div className="screen-caption">
        <div className="l">{label}</div>
        <div className="s">{sub}</div>
      </div>
    </div>
  );
}
